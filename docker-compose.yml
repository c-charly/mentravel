services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NUXT_DATA_DIR: /data
    env_file:
      - .env
    volumes:
      - mt-data:/data

  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm@12 && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      NUXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development
    env_file:
      - .env
    ports:
      - '3002:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm/store

volumes:
  mt-data:
  node_modules:
  pnpm-store:
    external: true
    name: pnpm-store-shared

